<!DOCTYPE html>
<html>
<body>
    <h2>View your available catalog</h2>
    {% if message %}<p><strong>{{ message }}</strong></p>{% endif %}
    {% if not products %}
      <p>No products available. Please contact your sponsor if you think this is an issue.</p>
    {% else %}
      <form action="{% url 'catalog:add_to_cart' %}" method="post">
      {% csrf_token %}
      <select id="order" name="order">
      {% for org in organizations %}
          <h3>{{ org.organization_name }}</h3>
          {% for p in products %}
              {% for p2 in p %}
                {% if p2.organization == org %}
                    <option value="{{ p2 }}">
                    <p>{{ p2.product_name }}<br>{{ p2.points_value }} points</p>
                    </option>
                {% endif %}
              {% endfor %}
          {% endfor %}
      {% endfor %}
      </select>
      <button type="submit">Order Selected Item</button>
      </form>
    {% endif %}
    <a href="/catalog/driver/order"><button type="button">Checkout</button></a>
</body>
</html>
