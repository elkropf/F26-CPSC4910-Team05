<!DOCTYPE html>
<html>
<body>
    <h2>Checkout</h2>
    {% if not order %}
        <p>You have no items in your checkout.</p>
    {% else %}
        {% for o in items %}
            <p>{{ o.product.product_name }}: {{ o.product.points_value }} points</p><br>
        {% endfor %}
        <p>Total: {{ order.total_points }} points</p>
    {% endif %}
    <a href="/catalog/driver"><button type="button">Return to Catalog</button></a>
</body>
</html>
