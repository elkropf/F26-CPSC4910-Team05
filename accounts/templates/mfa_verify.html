<h2>Enter your sign-in code</h2>
<p>Check your email for the six-digit code.</p>

{% if error_message %}
    <p>{{ error_message }}</p>
{% endif %}

<form method="post" action="{% url 'accounts:api_verify_mfa' %}">
    {% csrf_token %}
    <label for="code">Sign-in code</label>
    <input id="code" name="code" type="text" inputmode="numeric"
           autocomplete="one-time-code" maxlength="6" required>
    <button type="submit">Verify</button>
</form>
