<!DOCTYPE html>
<html>
<body>
    {% if view_as %}
        <p>You are currently viewing as a driver.</p>
        {% if view_as == 2 %}
        <a href="{% url 'accounts:remove_view_as' %}"><button>Return to Sponsor View</button></a>
        {% else %}
        <a href="{% url 'tempadmin:return_from_view_as' %}"><button>Return to Admin View</button></a>
        {% endif %}
    {% endif %}
    <h2>Welcome, {{ username }}</h2>
    <h3>Your current point total: (points)</h3>

    <a href="/catalog/driver"><button type="button">View Catalog</button></a>
</body>
</html>
