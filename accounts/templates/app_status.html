<!DOCTYPE html>
<html>
<body>
    {% if view_as %}
        <p>You are currently viewing as a driver.</p>
        {% if view_as == 2 %}
        <a href="{% url 'accounts:remove_view_as' %}"><button>Return to Sponsor View</button></a>
        {% else %}
        <a href="{% url 'tempadmin:return_from_view_as' %}"><button>Return to Admin View</button></a>
        {% endif %}
    {% endif %}
    {% if error_message %}<p><strong>{{ error_message }}</strong></p>{% endif %}
    {% if show_search %}
        <form action="{% url 'accounts:app_status' %}" method="get">
            <label for="id">Enter the ID of your application:</label>
            <input type="number" name="app_id" id="app_id"/>
            <button type="submit">Submit</button>
        </form>
    {% else %}
        <h2>Status of Application {{ app_number }}:</h2>
        <p>Explode: {{ app_stat }}</p>
    {% endif %}
</body>
</html>
