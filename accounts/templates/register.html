<!DOCTYPE html>
<html>
<body>

    <h2>Register</h2>

    <form action="{% url 'accounts:register' %}" method="post">
    {% csrf_token %}
        {% if error_message %}<p><strong>{{ error_message }}</strong></p>{% endif %}
        <label>Username</label>
        <input type="text" name="user_in"/>
        <label>Password</label>
        <input type="password" name="pass_in"/><br>

        <input type="radio" name="user_type" value="Driver"/>
        <label for="Driver">Driver</label><br>
        <input type="radio" name="user_type" value="Sponsor"/>
        <label for="Sponsor">Sponsor</label><br>
        <button type="submit">Register</button>

        <p>Already have an account?
            <a href="/login"><button type="button">Log In</button></a>
        </p>
    </form>

</body>
</html>
